title: "💡 Feature Request"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We'd love to hear your ideas.
        
        Please provide as much detail as possible about the feature you'd like to see.
  - type: textarea
    id: feature-description
    attributes:
      label: "Feature Description"
      description: "Describe the feature you'd like to see"
      placeholder: "I would like the extension to..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem It Solves"
      description: "What problem does this feature solve? Why is it needed?"
      placeholder: "Currently, users have to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "How do you envision this feature working?"
      placeholder: "The feature could work by..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Have you considered any alternative solutions?"
      placeholder: "I also thought about..."
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Any other context, mockups, or examples about the feature request"
      placeholder: "Screenshots, mockups, or examples..."
