title: "🐛 Bug Report (Discussion)"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        
        **Note:** For critical bugs, please use [Issues](../../issues/new) instead. This discussion is for non-critical bugs or when you want to discuss a potential bug.
  - type: textarea
    id: bug-description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is"
      placeholder: "The extension..."
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior"
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: "What you expected to happen"
      placeholder: "I expected..."
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: "Actual Behavior"
      description: "What actually happened"
      placeholder: "Instead, I saw..."
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots"
      description: "If applicable, add screenshots to help explain your problem"
      placeholder: "Drag and drop screenshots here or paste image URLs"
  - type: dropdown
    id: browser
    attributes:
      label: "Browser"
      options:
        - Chrome
        - Edge
        - Other
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: "Browser Version"
      placeholder: "e.g., Chrome 120"
  - type: input
    id: extension-version
    attributes:
      label: "Extension Version"
      placeholder: "e.g., 1.0.0"
  - type: input
    id: os
    attributes:
      label: "Operating System"
      placeholder: "e.g., macOS 14.0, Windows 11"
  - type: textarea
    id: console-errors
    attributes:
      label: "Console Errors"
      description: "If there are any console errors, please paste them here"
      placeholder: "Open DevTools (F12) → Console tab → Copy errors here"
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Any other context about the problem"
      placeholder: "Additional information..."
